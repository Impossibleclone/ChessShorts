name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-typecheck:
    name: Mobile — TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: ./apps/mobile
        run: npx tsc --noEmit

  api-checks:
    name: API — syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency install needed — pure syntax/AST check of the app package
      - name: Compile all API sources
        run: python -m compileall -q apps/api/app

      - name: Compile scripts
        run: python -m compileall -q apps/api/scripts
